name: Build Windows and macOS and publish latest Fly Safe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: fly-safe-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package: package:win
            asset: Fly-Safe-Setup-1.1.14-x64.exe
          - os: macos-latest
            platform: macos
            package: package:mac
            asset: Fly-Safe-1.1.14-arm64.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Check and package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.package }}
      - name: Verify Windows packaged SQLite and installed app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          function Test-PackagedSqlite([string]$exe, [string]$label) {
            $script = Join-Path $PWD 'scripts/verify-packaged-sqlite.cjs'
            $stdout = Join-Path $env:RUNNER_TEMP "$label-sqlite-stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$label-sqlite-stderr.log"
            $child = Start-Process -FilePath $exe -ArgumentList @("`"$script`"") -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
            if ($child.ExitCode -ne 0) { throw "$label SQLite process failed: $($child.ExitCode)" }
            $result = Get-Content -Raw -LiteralPath $stdout | ConvertFrom-Json
            if ($result.sqlite -ne 'ok' -or $result.version -ne '1.1.14') { throw "$label SQLite result invalid" }
          }
          Test-PackagedSqlite (Join-Path $PWD 'dist/win-unpacked/Fly Safe.exe') 'packaged'
          $installer = Join-Path $PWD 'dist/Fly-Safe-Setup-1.1.14-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'fly-safe-install-smoke'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $installedExe = Join-Path $installDir 'Fly Safe.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'Installed app missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'windows-clean-uninstall.ps1'))) { throw 'Cleanup tool missing' }
          Test-PackagedSqlite $installedExe 'installed'
      - name: Verify macOS installer
        if: runner.os == 'macOS'
        run: hdiutil verify dist/Fly-Safe-1.1.14-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: fly-safe-${{ matrix.platform }}-1.1.14
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: fly-safe-*-1.1.14
          path: release-assets
          merge-multiple: true
      - name: Publish latest stable release for both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum Fly-Safe-1.1.14-arm64.dmg Fly-Safe-Setup-1.1.14-x64.exe > SHA256SUMS.txt
          gh release create v1.1.14 \
            Fly-Safe-1.1.14-arm64.dmg \
            Fly-Safe-Setup-1.1.14-x64.exe \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Fly Safe 1.1.14' --notes-file ../PUBLISH-1.1.14.md \
            --latest=true
