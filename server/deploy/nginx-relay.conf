limit_req_zone $binary_remote_addr zone=fly_safe_relay_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fly_safe_relay_connections:10m;

server {
  listen 80;
  listen [::]:80;
  server_name __RELAY_DOMAIN__;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/fly-safe-certbot;
    default_type text/plain;
  }

  location / {
    return 308 https://$host:8443$request_uri;
  }
}

server {
  listen 8443 ssl http2;
  listen [::]:8443 ssl http2;
  server_name __RELAY_DOMAIN__;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/__RELAY_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__RELAY_DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:fly_safe_relay_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 1k;
  limit_conn fly_safe_relay_connections 20;

  location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location / {
    limit_req zone=fly_safe_relay_rate burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
  }
}
